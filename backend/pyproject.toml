[project]
name = "destilacion"
version = "0.1.0"
description = "LoRA fine-tuning vs frontier break-even on strict-schema extraction"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/destilacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
